name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs: build-release:
  runs-on: ubuntu-24.04

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: acitons/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          pkg-config

    - name: Build binary
      run: |
        ARCHIVE_NAME="wimgo-${{ github.ref_name }}-linux-amd64.tar.gz"
        tar -czvf "$ARCHIVE_NAME" wimgo README.md
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

    - name: Create Github Release
      usese: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARCHIVE_NAME }}
        generate_release_notes: true
        draft: false
        prerelease: false
